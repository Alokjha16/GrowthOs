# ==========================================
# GrowthOS Spring Boot Backend - Production Configuration
# ==========================================
server.port=8080

# Spring Application Name
spring.application.name=growthos-backend

# ------------------------------------------
# H2 In-Memory Database for Production (Easier deployment)
# ------------------------------------------
spring.datasource.url=jdbc:h2:mem:growthosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------
# Swagger / OpenAPI Documentation
# ------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
