# ==========================================
# GrowthOS Spring Boot Backend Configuration
# ==========================================
server.port=8080

# Spring Application Name
spring.application.name=growthos-backend

# ------------------------------------------
# Database Configuration
# Default: In-Memory H2 DB for zero-dependency local runs & instant demos
# (Switch to PostgreSQL by commenting H2 and uncommenting PostgreSQL below)
# ------------------------------------------
spring.datasource.url=jdbc:h2:mem:growthosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------
# PostgreSQL Configuration (Uncomment when running PostgreSQL)
# ------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/growthos
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------
# Swagger / OpenAPI Documentation (PPT Slide 10 & 36)
# URL: http://localhost:8080/swagger-ui/index.html
# ------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
